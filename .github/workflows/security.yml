name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Audit backend dependencies
        working-directory: backend
        run: |
          uv sync --frozen
          uv run --with pip-audit pip-audit --local --strict --cache-dir "$RUNNER_TEMP/pip-audit"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.141.0
    steps:
      - uses: actions/checkout@v7
      - name: Run OWASP-focused SAST
        run: >-
          semgrep scan --config p/owasp-top-ten --error
          --exclude frontend/node_modules --exclude backend/.venv

  filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan dependencies, secrets and IaC
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build --tag bishkek-delivery-backend:ci ./backend
      - name: Build frontend image
        run: docker build --tag bishkek-delivery-frontend:ci ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: bishkek-delivery-backend:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: bishkek-delivery-frontend:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
